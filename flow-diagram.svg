<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <style>
      .text-title { font-family: 'Geist', -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #000000; }
      .text-sub { font-family: 'Geist Mono', monospace; font-size: 11px; fill: #666666; }
      .text-mono { font-family: 'Geist Mono', monospace; font-size: 12px; fill: #000000; }
      .text-focal { font-family: 'Geist', -apple-system, sans-serif; font-weight: 600; font-size: 15px; fill: #ffffff; }
      .text-focal-sub { font-family: 'Geist Mono', monospace; font-size: 11px; fill: #cccccc; }
      .box { fill: #ffffff; stroke: #000000; stroke-width: 1.2; rx: 6; }
      .box-dashed { fill: #ffffff; stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4 4; rx: 6; }
      .focal { fill: #000000; stroke: #000000; stroke-width: 1.2; rx: 8; }
      .badge { fill: #f4f4f5; stroke: #000000; stroke-width: 1.0; rx: 3; }
      .badge-text { font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 500; fill: #000000; }
      .edge { stroke: #000000; stroke-width: 1.2; fill: none; }
      .arrow { fill: #000000; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#ffffff" />

  <!-- Input Sources -->
  <g transform="translate(40, 70)">
    <rect class="box" width="220" height="80" />
    <rect class="badge" x="12" y="12" width="70" height="18" />
    <text class="badge-text" x="20" y="25">INPUT</text>
    <text class="text-title" x="12" y="50">Natural Language</text>
    <text class="text-sub" x="12" y="68">"Checkout returns 500 error"</text>
  </g>

  <g transform="translate(40, 200)">
    <rect class="box" width="220" height="120" />
    <rect class="badge" x="12" y="12" width="84" height="18" />
    <text class="badge-text" x="18" y="25">PATTERNS</text>
    <text class="text-title" x="12" y="48">Branch Dispatch</text>
    <text class="text-sub" x="12" y="68">'bug @ >0.8' => fileJira</text>
    <text class="text-sub" x="12" y="86">'billing'    => openStripe</text>
    <text class="text-sub" x="12" y="104">_            => logInbox</text>
  </g>

  <!-- Central Focal Card: hev Decision Engine -->
  <g transform="translate(330, 110)">
    <rect class="focal" width="240" height="180" />
    <rect fill="#222222" stroke="#444444" stroke-width="1.0" rx="3" x="16" y="16" width="90" height="20" />
    <text style="font-family: 'Geist Mono', monospace; font-size: 11px; fill: #ffffff; font-weight: 600;" x="24" y="30">hev ENGINE</text>
    <text class="text-focal" x="16" y="65">Single-Pass Arbiter</text>
    <text class="text-focal-sub" x="16" y="88">1. Intent Type Detection</text>
    <text class="text-focal-sub" x="16" y="106">2. Single Forward Pass</text>
    <text class="text-focal-sub" x="16" y="124">3. Calibrated Probabilities</text>
    <text class="text-focal-sub" x="16" y="142">4. Guard Evaluation</text>
    <text class="text-focal-sub" x="16" y="160">&lt; 0.2ms latency</text>
  </g>

  <!-- Execution Tiers -->
  <g transform="translate(640, 50)">
    <rect class="box" width="220" height="75" />
    <rect class="badge" x="12" y="12" width="60" height="18" />
    <text class="badge-text" x="18" y="25">TIER 1</text>
    <text class="text-title" x="12" y="48">Zero-Dep Built-in</text>
    <text class="text-sub" x="12" y="66">Pure JS, 0.2ms, Offline</text>
  </g>

  <g transform="translate(640, 150)">
    <rect class="box" width="220" height="75" />
    <rect class="badge" x="12" y="12" width="60" height="18" />
    <text class="badge-text" x="18" y="25">TIER 2</text>
    <text class="text-title" x="12" y="48">GLiNER 2.5 (Local)</text>
    <text class="text-sub" x="12" y="66">fastino ONNX, 14ms</text>
  </g>

  <g transform="translate(640, 250)">
    <rect class="box-dashed" width="220" height="75" />
    <rect class="badge" x="12" y="12" width="60" height="18" />
    <text class="badge-text" x="18" y="25">TIER 3</text>
    <text class="text-title" x="12" y="48">System One (Cloud)</text>
    <text class="text-sub" x="12" y="66">TypeSafe Jev, 240ms</text>
  </g>

  <!-- Output Action -->
  <g transform="translate(330, 360)">
    <rect class="box" width="240" height="70" />
    <rect class="badge" x="12" y="12" width="70" height="18" />
    <text class="badge-text" x="20" y="25">OUTPUT</text>
    <text class="text-title" x="12" y="48">Executed Action / Label</text>
    <text class="text-sub" x="12" y="64">fileJira(text, { score: 0.94 })</text>
  </g>

  <!-- Connectors -->
  <path class="edge" d="M 260 110 L 330 160" marker-end="url(#arrow)" />
  <path class="edge" d="M 260 260 L 330 230" marker-end="url(#arrow)" />
  <path class="edge" d="M 570 150 L 640 90" marker-end="url(#arrow)" />
  <path class="edge" d="M 570 200 L 640 185" marker-end="url(#arrow)" />
  <path class="edge" d="M 570 250 L 640 285" marker-end="url(#arrow)" />
  <path class="edge" d="M 450 290 L 450 360" marker-end="url(#arrow)" />

</svg>
